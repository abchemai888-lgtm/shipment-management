<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Shipment Management</title>
    <script>
      // Single Page Application redirect for GitHub Pages & Custom Domains
      // Detects if running on github.io repository subpath or root custom domain
      var l = window.location;
      var pathSegmentsToKeep = (l.hostname.indexOf('github.io') > -1 && l.pathname.indexOf('/shipment-management') === 0) ? 1 : 0;
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
      );
    </script>
  </head>
  <body>
    <p>Redirecting...</p>
  </body>
</html>
